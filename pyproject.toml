[project]
name = "imdb-sentiment-analyzer"
version = "0.1.0"
description = "Sentiment analysis on IMDb reviews with a FastAPI serving layer"
readme = "README.md"
authors = [
    { name = "fazilchengapra", email = "muhammedfazilchengapra@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.1",
    "uvicorn[standard]>=0.54.0",
    "scikit-learn>=1.9.1",
    "pandas>=3.0.6",
    "nltk>=3.10.3",
    "joblib>=1.6.0",
    "mlflow>=3.16.1",
    "ipykernel>=7.4.0",
    "numpy>=2.5.3",
    "datasets>=5.0.1",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
    "ruff>=0.16.9",
]

[tool.uv]
package = false
